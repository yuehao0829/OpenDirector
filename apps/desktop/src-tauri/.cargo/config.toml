[env]
# These defaults are for local development using gstreamer-dev/ (Windows).
# In CI and on macOS, environment variables override these values (force = false).
# PKG_CONFIG is intentionally not set here; pnpm dev resolves it on demand.
# On Windows, run `pnpm setup:gstreamer` once to install the repo-local runtime and pkg-config.
PKG_CONFIG_PATH = { value = "gstreamer-dev/lib/pkgconfig", relative = true, force = false }
GSTREAMER_1_0_ROOT_MSVC_X86_64 = { value = "gstreamer-dev", relative = true, force = false }
GSTREAMER_1_0_ROOT_X86_64 = { value = "gstreamer-dev", relative = true, force = false }
