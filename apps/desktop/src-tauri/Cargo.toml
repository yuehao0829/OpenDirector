[package]
name = "opendirector"
version = "0.1.4"
description = "AI-powered video/audio editing software"
authors = ["OpenDirector Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
hound = "3.5"
symphonia = { version = "0.5", features = ["mp3", "aac", "flac", "vorbis", "wav", "isomp4"] }
png = "0.17"
arc-swap = "1"
gst = { package = "gstreamer", version = "0.25.1", features = ["v1_28"] }
gst_app = { package = "gstreamer-app", version = "0.25.0", features = ["v1_28"] }
gst_video = { package = "gstreamer-video", version = "0.25.0", features = ["v1_28"] }
ges = { package = "gstreamer-editing-services", version = "0.25.0", features = ["v1_28"] }

# Crypto
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
rand = "0.8"
base64 = "0.22"

# HTTP client
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"], default-features = false }

# Signing
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Filesystem paths
dirs = "6"

# Archive unpacking (MiniMax /v1/files/retrieve_content returns a tar of the audio + metadata)
tar = "0.4"

# TOS SDK
ve-tos-rust-sdk = { path = "vendor/ve-tos-rust-sdk", features = ["asynchronous", "tokio-runtime", "use-rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
async-trait = "0.1"
roxmltree = "0.20"

[features]
default = ["custom-protocol", "gstreamer-runtime"]
custom-protocol = ["tauri/custom-protocol"]
gstreamer-runtime = []

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSBitmapImageRep", "NSGraphics", "NSImage", "NSImageRep", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString"] }

[patch.crates-io]
tauri = { path = "vendor/tauri" }
