name: Build Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  GSTREAMER_MSVC_VERSION: '1.28.2'

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: ARM
            pkg_config_path: /opt/homebrew/lib/pkgconfig
            artifact_name: macos-dmg-arm
          - runner: macos-13
            arch: Intel
            pkg_config_path: /usr/local/lib/pkgconfig
            artifact_name: macos-dmg-intel
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Cache Homebrew GStreamer
        id: cache-brew-gst
        uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.pkg_config_path }}/..
            /opt/homebrew/Cellar/gstreamer
            /opt/homebrew/Cellar/gst-plugins-*
            /opt/homebrew/Cellar/gst-libav
            /opt/homebrew/Cellar/gst-rtsp-server-*
            /usr/local/Cellar/gstreamer
            /usr/local/Cellar/gst-plugins-*
            /usr/local/Cellar/gst-libav
            /usr/local/Cellar/gst-rtsp-server-*
          key: brew-gstreamer-${{ runner.os }}-${{ matrix.arch }}-v1

      - name: Install GStreamer (Homebrew)
        if: steps.cache-brew-gst.outputs.cache-hit != 'true'
        run: brew install gstreamer

      - name: Bundle GStreamer runtime
        run: bash scripts/bundle-gstreamer-macos.sh

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm build:desktop
        env:
          PKG_CONFIG_PATH: ${{ matrix.pkg_config_path }}

      - name: Add rpath to binary
        run: |
          BINARY="apps/desktop/src-tauri/target/release/OpenDirector"
          install_name_tool -add_rpath "@executable_path/../Resources/gstreamer-runtime/lib" "$BINARY"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 14

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Cache GStreamer runtime
        id: cache-gstreamer
        uses: actions/cache@v4
        with:
          path: C:\gstreamer\1.0\msvc\x86_64
          key: gstreamer-msvc-runtime-${{ env.GSTREAMER_MSVC_VERSION }}

      - name: Download GStreamer MSVC installer
        if: steps.cache-gstreamer.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://gstreamer.freedesktop.org/data/pkg/windows/${{ env.GSTREAMER_MSVC_VERSION }}/msvc/gstreamer-1.0-msvc-x86_64-${{ env.GSTREAMER_MSVC_VERSION }}.exe"
          $out = "${{ runner.temp }}\gstreamer-installer.exe"
          Write-Host "Downloading GStreamer from $url"
          curl.exe -L --retry 3 --retry-delay 5 -A "Wget/1.21.4" -o $out $url
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Download failed with exit code $LASTEXITCODE"
            exit 1
          }
          $size = (Get-Item $out).Length
          if ($size -lt 1MB) {
            Write-Error "Downloaded file is only $size bytes, likely an error page"
            exit 1
          }
          Write-Host "Downloaded $size bytes"

      - name: Install GStreamer MSVC runtime
        if: steps.cache-gstreamer.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $installer = "${{ runner.temp }}\gstreamer-installer.exe"
          $installDir = "C:\gstreamer\1.0\msvc\x86_64"
          Start-Process -FilePath $installer -ArgumentList '/SP-', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installDir" -Wait

      - name: Bundle GStreamer runtime
        shell: pwsh
        run: pwsh scripts/bundle-gstreamer-windows.ps1
        env:
          GSTREAMER_1_0_ROOT_MSVC_X86_64: C:\gstreamer\1.0\msvc\x86_64

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm build:desktop
        env:
          GSTREAMER_1_0_ROOT_MSVC_X86_64: C:\gstreamer\1.0\msvc\x86_64
          PKG_CONFIG_PATH: C:\gstreamer\1.0\msvc\x86_64\lib\pkgconfig

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS ARM artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg-arm
          path: artifacts/macos-arm

      - name: Download macOS Intel artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg-intel
          path: artifacts/macos-intel

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-nsis
          path: artifacts/windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/macos-arm/*.dmg
            artifacts/macos-intel/*.dmg
            artifacts/windows/*.exe
