name: Build Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  GSTREAMER_MSVC_VERSION: '1.28.2'

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: ARM
            target: aarch64-apple-darwin
            pkg_config_path: /opt/homebrew/lib/pkgconfig
            pkg_config_bin: /opt/homebrew/bin/pkg-config
            artifact_name: macos-dmg-arm
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: "v2-macos-fix"

      - name: Install GStreamer (Homebrew)
        run: brew install gstreamer

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PRIVATE_KEY: ${{ secrets.APPLE_API_KEY_PRIVATE_KEY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_CERTIFICATE not set, skipping signing"
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$CERT_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Write App Store Connect API key to file for notarytool
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          echo -n "$APPLE_API_KEY_PRIVATE_KEY" > "$API_KEY_PATH"

      - name: Build Tauri app
        run: pnpm build:desktop
        env:
          PKG_CONFIG: ${{ matrix.pkg_config_bin }}
          PKG_CONFIG_PATH: ${{ matrix.pkg_config_path }}

      - name: Add rpath to binary
        run: |
          BINARY="apps/desktop/src-tauri/target/release/OpenDirector"
          install_name_tool -add_rpath "@executable_path/../Resources/gstreamer-runtime/lib" "$BINARY"

      - name: Sign and notarize app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_CERTIFICATE not set, skipping signing & notarization"
            exit 0
          fi

          IDENTITY="Developer ID Application: Hao Yue (X7HJ7KSU55)"
          ENTITLEMENTS="apps/desktop/src-tauri/entitlements.plist"
          DMG_DIR="apps/desktop/src-tauri/target/release/bundle/dmg"
          DMG_NAME=$(ls "$DMG_DIR"/*.dmg | head -1)

          # Extract .app from DMG (Tauri cleans up the .app after bundling)
          echo "Extracting app from DMG..."
          MOUNT_POINT="$RUNNER_TEMP/dmg_mount"
          hdiutil attach "$DMG_NAME" -quiet -nobrowse -mountpoint "$MOUNT_POINT"
          APP_SRC="$MOUNT_POINT/OpenDirector.app"
          APP_PATH="$RUNNER_TEMP/OpenDirector.app"
          cp -a "$APP_SRC" "$APP_PATH"
          hdiutil detach "$MOUNT_POINT" -quiet

          # Deep-sign all binaries (main executable + GStreamer dylibs)
          echo "Signing all binaries in app bundle..."
          find "$APP_PATH/Contents" -type f \( -name '*.dylib' -o -name '*.so' \) -exec codesign --force --sign "$IDENTITY" --timestamp {} \;
          codesign --force --deep --sign "$IDENTITY" --options runtime --entitlements "$ENTITLEMENTS" --timestamp "$APP_PATH"

          echo "Verifying signature..."
          codesign --verify --deep --strict "$APP_PATH"

          # Create DMG for notarization
          echo "Creating DMG for notarization..."
          NOTARIZE_DMG="$RUNNER_TEMP/OpenDirector_notarize.dmg"
          hdiutil create -volname "OpenDirector" -srcfolder "$APP_PATH" -ov -format UDZO "$NOTARIZE_DMG"

          echo "Submitting for notarization..."
          xcrun notarytool submit "$NOTARIZE_DMG" \
            --key "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait

          echo "Stapling notarization ticket (with retry)..."
          for i in 1 2 3 4 5; do
            if xcrun stapler staple "$APP_PATH"; then
              echo "Staple succeeded on attempt $i"
              break
            fi
            echo "Staple failed (attempt $i), waiting 30s for CloudKit propagation..."
            sleep 30
          done

          # Recreate final DMG with stapled app
          echo "Recreating DMG with stapled app..."
          rm -f "$DMG_NAME"
          hdiutil create -volname "OpenDirector" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_DIR/OpenDirector_0.1.1_aarch64.dmg"

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP"/AuthKey_*.p8

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 14

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Cache GStreamer runtime
        id: cache-gstreamer
        uses: actions/cache@v4
        with:
          path: C:\gstreamer\1.0\msvc\x86_64
          key: gstreamer-msvc-runtime-${{ env.GSTREAMER_MSVC_VERSION }}

      - name: Download GStreamer MSVC installer
        if: steps.cache-gstreamer.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assetName = "gstreamer-1.0-msvc-x86_64-${{ env.GSTREAMER_MSVC_VERSION }}.exe"
          $out = "${{ runner.temp }}\$assetName"
          Write-Host "Downloading GStreamer $assetName from GitHub Release..."
          gh release download gstreamer-runtime --repo ${{ github.repository }} --pattern $assetName --dir ${{ runner.temp }}
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to download GStreamer from GitHub Release"
            exit 1
          }
          $size = (Get-Item $out).Length
          if ($size -lt 1MB) {
            Write-Error "Downloaded file is only $size bytes, likely corrupted"
            exit 1
          }
          Write-Host "Downloaded $size bytes"

      - name: Install GStreamer MSVC runtime
        if: steps.cache-gstreamer.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $installer = "${{ runner.temp }}\gstreamer-1.0-msvc-x86_64-${{ env.GSTREAMER_MSVC_VERSION }}.exe"
          $installDir = "C:\gstreamer\1.0\msvc\x86_64"
          Start-Process -FilePath $installer -ArgumentList '/SP-', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installDir" -Wait

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm build:desktop
        env:
          GSTREAMER_1_0_ROOT_MSVC_X86_64: C:\gstreamer\1.0\msvc\x86_64
          PKG_CONFIG: C:\gstreamer\1.0\msvc\x86_64\bin\pkg-config.exe
          PKG_CONFIG_PATH: C:\gstreamer\1.0\msvc\x86_64\lib\pkgconfig

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS ARM artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg-arm
          path: artifacts/macos-arm

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-nsis
          path: artifacts/windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/macos-arm/*.dmg
            artifacts/windows/*.exe
