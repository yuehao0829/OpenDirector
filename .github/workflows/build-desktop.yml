name: Build Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  GSTREAMER_RUNTIME_RELEASE_TAG: 'gstreamer-runtime'
  GSTREAMER_MSVC_VERSION: '1.28.2'
  GSTREAMER_MACOS_VERSION: '1.28.2'

jobs:
  build-macos-arm:
    name: Build macOS (ARM)
    runs-on: macos-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/v') && (!startsWith(github.ref, 'refs/heads/main') || !contains(github.event.head_commit.message, '[skip-main-ci]')) }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: "v2-macos-arm"

      - name: Install macOS GStreamer build dependencies
        run: brew install gstreamer

      - name: Download prebuilt macOS GStreamer runtime
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          runtimeDir="$RUNNER_TEMP/gstreamer-macos-runtime"
          if scripts/download-gstreamer-macos-runtime.sh --allow-missing \
            "${{ github.repository }}" \
            "${{ env.GSTREAMER_RUNTIME_RELEASE_TAG }}" \
            "${{ env.GSTREAMER_MACOS_VERSION }}" \
            "$runtimeDir" \
            "$RUNNER_TEMP"; then
            echo "OPENDIRECTOR_GSTREAMER_RUNTIME_ROOT=$runtimeDir" >> "$GITHUB_ENV"
          else
            download_status=$?
            if [ "$download_status" -ne 3 ]; then
              exit "$download_status"
            fi
          fi

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PRIVATE_KEY: ${{ secrets.APPLE_API_KEY_PRIVATE_KEY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_CERTIFICATE not set, skipping signing"
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$CERT_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Write App Store Connect API key to file for notarytool
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          echo -n "$APPLE_API_KEY_PRIVATE_KEY" > "$API_KEY_PATH"

      - name: Build Tauri app
        run: pnpm build:desktop
        env:
          PKG_CONFIG: /opt/homebrew/bin/pkg-config
          PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig

      - name: Bundle GStreamer into macOS app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          DMG_DIR="apps/desktop/src-tauri/target/release/bundle/dmg"
          DMG_NAME="$(find "$DMG_DIR" -maxdepth 1 -name "*.dmg" -print | head -1)"
          if [ -z "$DMG_NAME" ]; then
            echo "::error::No DMG produced by Tauri"
            exit 1
          fi

          APP_PATH="$RUNNER_TEMP/OpenDirector.app"
          rm -rf "$APP_PATH"

          MOUNT_POINT="$(mktemp -d "$RUNNER_TEMP/dmg_mount.XXXXXX")"
          hdiutil attach "$DMG_NAME" -quiet -nobrowse -mountpoint "$MOUNT_POINT"
          APP_SRC="$(find "$MOUNT_POINT" -maxdepth 1 -name "*.app" -type d | head -1)"
          if [ -z "$APP_SRC" ]; then
            hdiutil detach "$MOUNT_POINT" -quiet || true
            echo "::error::No .app found in $DMG_NAME"
            exit 1
          fi
          cp -a "$APP_SRC" "$APP_PATH"
          hdiutil detach "$MOUNT_POINT" -quiet || true
          rm -rf "$MOUNT_POINT"

          echo "Bundling GStreamer into $APP_PATH ..."
          scripts/fix-macos-app-gstreamer.sh "$APP_PATH"

          echo "MACOS_APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "MACOS_DMG_NAME=$DMG_NAME" >> "$GITHUB_ENV"

          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_CERTIFICATE not set, ad-hoc signing app"
            codesign --force --deep --sign - "$APP_PATH"
            codesign --verify --deep --strict "$APP_PATH"

            echo "Recreating unsigned DMG with bundled GStreamer"
            rm -f "$DMG_NAME"
            hdiutil create -volname "OpenDirector" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_NAME"
          fi

      - name: Sign and notarize app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_CERTIFICATE not set, skipping signing & notarization"
            exit 0
          fi

          IDENTITY="${{ secrets.APPLE_SIGNING_IDENTITY }}"
          ENTITLEMENTS="apps/desktop/src-tauri/entitlements.plist"
          APP_PATH="$MACOS_APP_PATH"
          DMG_NAME="$MACOS_DMG_NAME"
          if [ -z "$APP_PATH" ] || [ -z "$DMG_NAME" ] || [ ! -d "$APP_PATH" ]; then
            echo "::error::Bundled macOS app path is missing"
            exit 1
          fi

          sign_macho_tree() {
            local root="$1"
            local identity="$2"
            shift 2
            local extra_flags="$*"
            [ -d "$root" ] || return 0
            find "$root" -type f \( -name '*.dylib' -o -name '*.so' \) -exec codesign --force --sign "$identity" $extra_flags {} +
            find "$root" -type f -perm +111 ! -name '*.dylib' ! -name '*.so' ! -name '*.plist' ! -name '*.json' ! -name '*.png' ! -name '*.icns' ! -name '*.strings' ! -name '*.nib' ! -name '*.lproj' | while IFS= read -r code_path; do
              if file "$code_path" | grep -q "Mach-O"; then
                codesign --force --sign "$identity" $extra_flags "$code_path"
              fi
            done
          }

          echo "Signing nested Mach-O files..."
          sign_macho_tree "$APP_PATH/Contents" "$IDENTITY" --options runtime --timestamp

          # Sign any nested .app bundles (e.g. terminal-notifier)
          find "$APP_PATH/Contents" -name '*.app' -exec codesign --force --deep --sign "$IDENTITY" --options runtime --timestamp {} \;

          # Sign all executables in Contents/MacOS with hardened runtime + entitlements
          echo "Signing executables..."
          find "$APP_PATH/Contents/MacOS" -type f -exec codesign --force --sign "$IDENTITY" --options runtime --entitlements "$ENTITLEMENTS" --timestamp {} \;

          # Sign the app bundle (include --options runtime so nested binaries aren't re-signed without it)
          echo "Signing app bundle..."
          codesign --force --sign "$IDENTITY" --options runtime --entitlements "$ENTITLEMENTS" --timestamp "$APP_PATH"

          echo "Verifying signature..."
          codesign --verify --deep --strict "$APP_PATH"

          # Create DMG for notarization
          echo "Creating DMG for notarization..."
          NOTARIZE_DMG="$RUNNER_TEMP/OpenDirector_notarize.dmg"
          hdiutil create -volname "OpenDirector" -srcfolder "$APP_PATH" -ov -format UDZO "$NOTARIZE_DMG"

          echo "Submitting for notarization..."
          SUBMIT_OUTPUT=$(xcrun notarytool submit "$NOTARIZE_DMG" \
            --key "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait 2>&1) || true

          echo "$SUBMIT_OUTPUT"

          if echo "$SUBMIT_OUTPUT" | grep -q "status: Accepted"; then
            echo "Notarization accepted!"
          else
            echo "Notarization failed, fetching log..."
            SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | grep 'id:' | head -1 | awk '{print $2}')
            if [ -n "$SUBMISSION_ID" ]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --key "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8" \
                --key-id "$APPLE_API_KEY" \
                --issuer "$APPLE_API_ISSUER"
            fi
            echo "::error::Notarization failed"
            exit 1
          fi

          echo "Stapling notarization ticket (with retry)..."
          STAPLE_SUCCESS=false
          for i in 1 2 3 4 5 6 7 8; do
            if xcrun stapler staple "$APP_PATH"; then
              echo "Staple succeeded on attempt $i"
              STAPLE_SUCCESS=true
              break
            fi
            echo "Staple failed (attempt $i), waiting 60s for CloudKit propagation..."
            sleep 60
          done
          if [ "$STAPLE_SUCCESS" != "true" ]; then
            echo "::warning::Staple failed after 8 attempts; app is notarized but ticket is not stapled"
          fi

          # Recreate final DMG with stapled app
          echo "Recreating DMG with stapled app..."
          rm -f "$DMG_NAME"
          sleep 2
          hdiutil create -volname "OpenDirector" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_NAME"

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP"/AuthKey_*.p8

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-arm
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 14

  build-macos-intel:
    name: Build macOS (Intel)
    runs-on: macos-13
    if: ${{ !startsWith(github.ref, 'refs/tags/v') && startsWith(github.ref, 'refs/heads/main') && !contains(github.event.head_commit.message, '[skip-main-ci]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: "v2-macos-intel"

      - name: Install macOS GStreamer build dependencies
        run: brew install gstreamer

      - name: Download prebuilt macOS GStreamer runtime
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          runtimeDir="$RUNNER_TEMP/gstreamer-macos-runtime"
          if scripts/download-gstreamer-macos-runtime.sh --allow-missing \
            "${{ github.repository }}" \
            "${{ env.GSTREAMER_RUNTIME_RELEASE_TAG }}" \
            "${{ env.GSTREAMER_MACOS_VERSION }}" \
            "$runtimeDir" \
            "$RUNNER_TEMP"; then
            echo "OPENDIRECTOR_GSTREAMER_RUNTIME_ROOT=$runtimeDir" >> "$GITHUB_ENV"
          else
            download_status=$?
            if [ "$download_status" -ne 3 ]; then
              exit "$download_status"
            fi
          fi

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PRIVATE_KEY: ${{ secrets.APPLE_API_KEY_PRIVATE_KEY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_CERTIFICATE not set, skipping signing"
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$CERT_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Write App Store Connect API key to file for notarytool
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          echo -n "$APPLE_API_KEY_PRIVATE_KEY" > "$API_KEY_PATH"

      - name: Build Tauri app
        run: pnpm build:desktop
        env:
          PKG_CONFIG: /usr/local/bin/pkg-config
          PKG_CONFIG_PATH: /usr/local/lib/pkgconfig

      - name: Bundle GStreamer into macOS app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          DMG_DIR="apps/desktop/src-tauri/target/release/bundle/dmg"
          DMG_NAME="$(find "$DMG_DIR" -maxdepth 1 -name "*.dmg" -print | head -1)"
          if [ -z "$DMG_NAME" ]; then
            echo "::error::No DMG produced by Tauri"
            exit 1
          fi

          APP_PATH="$RUNNER_TEMP/OpenDirector.app"
          rm -rf "$APP_PATH"

          MOUNT_POINT="$(mktemp -d "$RUNNER_TEMP/dmg_mount.XXXXXX")"
          hdiutil attach "$DMG_NAME" -quiet -nobrowse -mountpoint "$MOUNT_POINT"
          APP_SRC="$(find "$MOUNT_POINT" -maxdepth 1 -name "*.app" -type d | head -1)"
          if [ -z "$APP_SRC" ]; then
            hdiutil detach "$MOUNT_POINT" -quiet || true
            echo "::error::No .app found in $DMG_NAME"
            exit 1
          fi
          cp -a "$APP_SRC" "$APP_PATH"
          hdiutil detach "$MOUNT_POINT" -quiet || true
          rm -rf "$MOUNT_POINT"

          echo "Bundling GStreamer into $APP_PATH ..."
          scripts/fix-macos-app-gstreamer.sh "$APP_PATH"

          echo "MACOS_APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "MACOS_DMG_NAME=$DMG_NAME" >> "$GITHUB_ENV"

          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_CERTIFICATE not set, ad-hoc signing app"
            codesign --force --deep --sign - "$APP_PATH"
            codesign --verify --deep --strict "$APP_PATH"

            echo "Recreating unsigned DMG with bundled GStreamer"
            rm -f "$DMG_NAME"
            hdiutil create -volname "OpenDirector" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_NAME"
          fi

      - name: Sign and notarize app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_CERTIFICATE not set, skipping signing & notarization"
            exit 0
          fi

          IDENTITY="${{ secrets.APPLE_SIGNING_IDENTITY }}"
          ENTITLEMENTS="apps/desktop/src-tauri/entitlements.plist"
          APP_PATH="$MACOS_APP_PATH"
          DMG_NAME="$MACOS_DMG_NAME"
          if [ -z "$APP_PATH" ] || [ -z "$DMG_NAME" ] || [ ! -d "$APP_PATH" ]; then
            echo "::error::Bundled macOS app path is missing"
            exit 1
          fi

          sign_macho_tree() {
            local root="$1"
            local identity="$2"
            shift 2
            local extra_flags="$*"
            [ -d "$root" ] || return 0
            find "$root" -type f \( -name '*.dylib' -o -name '*.so' \) -exec codesign --force --sign "$identity" $extra_flags {} +
            find "$root" -type f -perm +111 ! -name '*.dylib' ! -name '*.so' ! -name '*.plist' ! -name '*.json' ! -name '*.png' ! -name '*.icns' ! -name '*.strings' ! -name '*.nib' ! -name '*.lproj' | while IFS= read -r code_path; do
              if file "$code_path" | grep -q "Mach-O"; then
                codesign --force --sign "$identity" $extra_flags "$code_path"
              fi
            done
          }

          echo "Signing nested Mach-O files..."
          sign_macho_tree "$APP_PATH/Contents" "$IDENTITY" --options runtime --timestamp

          # Sign any nested .app bundles (e.g. terminal-notifier)
          find "$APP_PATH/Contents" -name '*.app' -exec codesign --force --deep --sign "$IDENTITY" --options runtime --timestamp {} \;

          # Sign all executables in Contents/MacOS with hardened runtime + entitlements
          echo "Signing executables..."
          find "$APP_PATH/Contents/MacOS" -type f -exec codesign --force --sign "$IDENTITY" --options runtime --entitlements "$ENTITLEMENTS" --timestamp {} \;

          # Sign the app bundle (include --options runtime so nested binaries aren't re-signed without it)
          echo "Signing app bundle..."
          codesign --force --sign "$IDENTITY" --options runtime --entitlements "$ENTITLEMENTS" --timestamp "$APP_PATH"

          echo "Verifying signature..."
          codesign --verify --deep --strict "$APP_PATH"

          # Create DMG for notarization
          echo "Creating DMG for notarization..."
          NOTARIZE_DMG="$RUNNER_TEMP/OpenDirector_notarize.dmg"
          hdiutil create -volname "OpenDirector" -srcfolder "$APP_PATH" -ov -format UDZO "$NOTARIZE_DMG"

          echo "Submitting for notarization..."
          SUBMIT_OUTPUT=$(xcrun notarytool submit "$NOTARIZE_DMG" \
            --key "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait 2>&1) || true

          echo "$SUBMIT_OUTPUT"

          if echo "$SUBMIT_OUTPUT" | grep -q "status: Accepted"; then
            echo "Notarization accepted!"
          else
            echo "Notarization failed, fetching log..."
            SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | grep 'id:' | head -1 | awk '{print $2}')
            if [ -n "$SUBMISSION_ID" ]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --key "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8" \
                --key-id "$APPLE_API_KEY" \
                --issuer "$APPLE_API_ISSUER"
            fi
            echo "::error::Notarization failed"
            exit 1
          fi

          echo "Stapling notarization ticket (with retry)..."
          STAPLE_SUCCESS=false
          for i in 1 2 3 4 5 6 7 8; do
            if xcrun stapler staple "$APP_PATH"; then
              echo "Staple succeeded on attempt $i"
              STAPLE_SUCCESS=true
              break
            fi
            echo "Staple failed (attempt $i), waiting 60s for CloudKit propagation..."
            sleep 60
          done
          if [ "$STAPLE_SUCCESS" != "true" ]; then
            echo "::warning::Staple failed after 8 attempts; app is notarized but ticket is not stapled"
          fi

          # Recreate final DMG with stapled app
          echo "Recreating DMG with stapled app..."
          rm -f "$DMG_NAME"
          sleep 2
          hdiutil create -volname "OpenDirector" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_NAME"

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP"/AuthKey_*.p8

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-intel
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 14

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/v') && (!startsWith(github.ref, 'refs/heads/main') || !contains(github.event.head_commit.message, '[skip-main-ci]')) }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Cache GStreamer runtime
        id: cache-gstreamer
        uses: actions/cache@v4
        with:
          path: C:\gstreamer\1.0\msvc\x86_64
          key: gstreamer-msvc-runtime-${{ env.GSTREAMER_MSVC_VERSION }}

      - name: Download GStreamer MSVC installer
        if: steps.cache-gstreamer.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assetName = "gstreamer-1.0-msvc-x86_64-${{ env.GSTREAMER_MSVC_VERSION }}.exe"
          $out = "${{ runner.temp }}\$assetName"
          Write-Host "Downloading GStreamer $assetName from GitHub Release..."
          gh release download ${{ env.GSTREAMER_RUNTIME_RELEASE_TAG }} --repo ${{ github.repository }} --pattern $assetName --dir ${{ runner.temp }}
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to download GStreamer from GitHub Release"
            exit 1
          }
          $size = (Get-Item $out).Length
          if ($size -lt 1MB) {
            Write-Error "Downloaded file is only $size bytes, likely corrupted"
            exit 1
          }
          Write-Host "Downloaded $size bytes"

      - name: Install GStreamer MSVC runtime
        if: steps.cache-gstreamer.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $installer = "${{ runner.temp }}\gstreamer-1.0-msvc-x86_64-${{ env.GSTREAMER_MSVC_VERSION }}.exe"
          $installDir = "C:\gstreamer\1.0\msvc\x86_64"
          Start-Process -FilePath $installer -ArgumentList '/SP-', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installDir" -Wait

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm build:desktop
        env:
          GSTREAMER_1_0_ROOT_MSVC_X86_64: C:\gstreamer\1.0\msvc\x86_64
          PKG_CONFIG: C:\gstreamer\1.0\msvc\x86_64\bin\pkg-config.exe
          PKG_CONFIG_PATH: C:\gstreamer\1.0\msvc\x86_64\lib\pkgconfig

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Find latest main CI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            --repo ${{ github.repository }} \
            --branch main \
            --workflow "Build Desktop" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful 'Build Desktop' run found on main"
            exit 1
          fi
          echo "MAIN_CI_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Download artifacts from main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          download() { gh run download "$MAIN_CI_RUN_ID" --name "$1" --dir "$2"; }
          download macos-dmg-arm  artifacts/macos-arm  &
          download macos-dmg-intel artifacts/macos-intel &
          download windows-nsis    artifacts/windows    &
          wait

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/macos-arm/*.dmg
            artifacts/macos-intel/*.dmg
            artifacts/windows/*.exe
